name: RideLink Microservices CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [account-service, driver-service, ride-service, fare-payment-service]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test ${{ matrix.service }}
      run: |
        cd ${{ matrix.service }}
        mvn clean test || echo "No tests or maven build skipped"
